name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://sns-project.sreng087.workers.dev' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Validate database migrations (Expand-Contract safety)
        run: pnpm run db:validate

      - name: Apply D1 migrations
        run: pnpm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env=""
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          secrets: |
            BETTER_AUTH_SECRET
            BETTER_AUTH_URL
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            PRODUCTION_URL
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ env.PRODUCTION_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PRODUCTION_URL: ${{ env.PRODUCTION_URL }}

      - name: Verify production deployment health
        run: |
          echo "Verifying application health at $PRODUCTION_URL/api/health..."
          RESPONSE=$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$PRODUCTION_URL/api/health")
          echo "Health response: $RESPONSE"
          if ! echo "$RESPONSE" | grep -q '"status":"healthy"'; then
            echo "Health check failed: expected 'healthy', received: $RESPONSE"
            exit 1
          fi
          echo "Production deployment is verified healthy."

      - name: Deployment summary
        if: success()
        run: |
          echo "### 🚀 Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Main Branch (Production)** | ✅ Live & Healthy | [$PRODUCTION_URL]($PRODUCTION_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker:** \`sns-project\`" >> $GITHUB_STEP_SUMMARY
          echo "- **D1 Database:** \`sns-project-db\`" >> $GITHUB_STEP_SUMMARY
          echo "- **KV Namespace:** \`sns-project-auth-kv\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check:** \`$PRODUCTION_URL/api/health\` ✅" >> $GITHUB_STEP_SUMMARY

      - name: Report deployment failure alert
        if: failure()
        run: |
          echo "### ⚠️ Production Deployment Failed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Warning:** Database migrations may have already executed against production \`sns-project-db\`." >> $GITHUB_STEP_SUMMARY
          echo "Check the step logs above to determine if migrations ran and resolve the deployment failure." >> $GITHUB_STEP_SUMMARY
