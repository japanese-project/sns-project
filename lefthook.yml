pre-commit:
  parallel: true
  commands:
    eslint:
      stage_fixed: true
      glob: '*.{ts,tsx}'
      run: npm exec -- eslint --fix --quiet {staged_files}

pre-push:
  parallel: true
  commands:
    audit:
      run: npm audit
    check:
      run: npm run check
    format:
      run: npm run format:check
    lint:
      run: npm run lint
