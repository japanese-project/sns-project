pre-commit:
  parallel: true
  commands:
    eslint:
      stage_fixed: true
      glob: '*.{ts,tsx}'
      run: pnpm exec eslint --fix --quiet {staged_files}

pre-push:
  parallel: true
  commands:
    audit:
      run: pnpm audit
    check:
      run: pnpm run check
    format:
      run: pnpm run format:check
    lint:
      run: pnpm run lint
