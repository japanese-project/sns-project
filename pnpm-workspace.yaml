allowBuilds:
  # Pulled in transitively by svelte-i18n via cli-color. Its postinstall only prints an
  # install notice and is wrapped in a try/catch that swallows failures, so there is nothing to
  # build and nothing to run.
  es5-ext: false
  esbuild: true
  lefthook: true
  workerd: false
overrides:
  cookie@<0.7.0: ^0.7.0
  esbuild@<=0.24.2: ^0.25.0
  undici@>=7.28.0 <7.29.1: ^7.29.1
